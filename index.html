<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tangkap Aku!</title>
    <style>
        body { background: #111; color: white; text-align: center; overflow: hidden; font-family: sans-serif; }
        #kabur {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: red; color: white; padding: 20px; border-radius: 10px;
            font-size: 20px; font-weight: bold;
            transition: top 0.1s, left 0.1s;
        }
    </style>
</head>
<body>
    <h2>Bisa sentuh tombol ini?</h2>
    
    <div id="kabur">SENTUH AKU!</div>

    <script>
        const btn = document.getElementById('kabur');
        
        // Mendeteksi sentuhan di HP
        btn.addEventListener('touchstart', function(e) {
            e.preventDefault(); // Mencegah tombol terklik
            
            // Pindah ke posisi random (disesuaikan dengan ukuran layar HP)
            const maxX = window.innerWidth - 100;
            const maxY = window.innerHeight - 100;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
            btn.style.transform = 'none';
        });
    </script>
</body>
</html>
